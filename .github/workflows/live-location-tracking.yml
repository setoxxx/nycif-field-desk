name: Live Location Tracking QA

on:
  pull_request:
    paths:
      - "index.html"
      - "live-location-tracking-v01.js"
      - "live-location-control-handoff-v01.js"
      - "tests/live-location-tracking.test.cjs"
      - "tests/live-location-single-control.playwright.mjs"
      - "tests/public-map-retirement-contract.mjs"
      - ".github/workflows/live-location-tracking.yml"

permissions:
  contents: read

jobs:
  live-location-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic controller tests
        run: node tests/live-location-tracking.test.cjs

      - name: Detect public runtime state
        id: runtime
        shell: bash
        run: |
          if grep -q 'https://nycinfocus.com/map/' index.html && ! grep -qi 'leaflet' index.html; then
            echo 'state=retired' >> "$GITHUB_OUTPUT"
          else
            echo 'state=active' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate retired redirect runtime
        if: steps.runtime.outputs.state == 'retired'
        run: node tests/public-map-retirement-contract.mjs

      - name: Install browser QA dependencies
        if: steps.runtime.outputs.state == 'active'
        run: |
          npm install --no-save playwright@1.54.1 @axe-core/playwright@4.10.2
          npx playwright install chromium

      - name: Start exact reviewed runtime
        if: steps.runtime.outputs.state == 'active'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nycif-live-location-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nycif-live-location-server.log
          exit 1

      - name: Run mobile and desktop rendered live GPS gates
        if: steps.runtime.outputs.state == 'active'
        shell: bash
        run: |
          mkdir -p artifacts/live-location
          set +e
          node tests/live-location-single-control.playwright.mjs 2>&1 | tee artifacts/live-location/live-location-gates.log
          status=${PIPESTATUS[0]}
          cp /tmp/nycif-live-location-server.log artifacts/live-location/server.log || true
          exit "$status"

      - name: Record retired live-location semantics
        if: steps.runtime.outputs.state == 'retired'
        run: |
          mkdir -p artifacts/live-location
          printf '%s\n' 'RETIRED_RUNTIME: deterministic live-location controller tests retained; rendered Leaflet/GPS shell is intentionally absent from the public root.' > artifacts/live-location/live-location-gates.log

      - name: Upload live GPS QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-location-tracking-qa
          path: artifacts/live-location/
          if-no-files-found: warn
          retention-days: 30
