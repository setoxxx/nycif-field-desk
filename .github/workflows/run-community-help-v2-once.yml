name: Run Community Help v2 Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    if: github.event.issue.title == 'RUN COMMUNITY HELP V2 GENERATION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/community-help-stages-1-5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate source-backed files
        run: python scripts/sync_community_help_v2.py
      - name: Validate expanded directory
        run: python scripts/validate_community_help.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/community-help
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Refresh source-driven Community Help v2 data [skip ci]'
            git push origin HEAD:feature/community-help-stages-1-5
          fi
      - name: Report and close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --body 'Community Help v2 generation finished with status: **${{ job.status }}**. Generated files target `feature/community-help-stages-1-5`.'
          gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --reason completed
      - name: Remove one-time runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/run-community-help-v2-once.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" -f message='Remove completed Community Help v2 runner' -f sha="$sha" -f branch='main'
          fi
