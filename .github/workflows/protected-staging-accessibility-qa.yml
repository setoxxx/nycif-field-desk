name: Protected Staging Accessibility QA

on:
  pull_request:
    paths:
      - "index.html"
      - "accessibility-v01.js"
      - "accessibility-v01.css"
      - "tests/public-map-retirement-contract.mjs"
      - "tests/test_protected_staging_accessibility_contract.py"
      - ".github/workflows/protected-staging-accessibility-qa.yml"

permissions:
  contents: read

jobs:
  accessibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect public runtime state
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'https://nycinfocus.com/map/' index.html && ! grep -Eqi 'leaflet|raw\.githubusercontent\.com' index.html; then
            echo 'state=retired' >> "$GITHUB_OUTPUT"
          else
            echo 'state=active' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate accessibility JavaScript syntax
        if: steps.runtime.outputs.state == 'active'
        run: node --check accessibility-v01.js

      - name: Run active dependency-free accessibility contract tests
        if: steps.runtime.outputs.state == 'active'
        run: python3 tests/test_protected_staging_accessibility_contract.py

      - name: Run retired redirect accessibility contract
        if: steps.runtime.outputs.state == 'retired'
        run: node tests/public-map-retirement-contract.mjs
