name: Protected Staging Accessibility QA

on:
  pull_request:
    paths:
      - "index.html"
      - "accessibility-v01.js"
      - "accessibility-v01.css"
      - "tests/test_protected_staging_accessibility_contract.py"
      - ".github/workflows/protected-staging-accessibility-qa.yml"

permissions:
  contents: read

jobs:
  accessibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate accessibility JavaScript syntax
        run: node --check accessibility-v01.js

      - name: Run accessibility contract tests
        run: python3 -m pytest -q tests/test_protected_staging_accessibility_contract.py
