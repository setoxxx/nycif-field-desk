name: Deploy NYCIF Field Desk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build retirement-only Pages artifact
        run: python3 scripts/build_retired_pages.py "$RUNNER_TEMP/field-desk-pages"

      - name: Verify retirement contract before upload
        run: node tests/public-map-retirement-contract.mjs

      - name: Upload retirement-only static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/field-desk-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
