name: Probe Live Feeds Refresh

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  probe:
    if: github.event.issue.title == 'PROBE LIVE FEEDS REFRESH'
    runs-on: ubuntu-latest
    steps:
      - name: Read latest live-feeds Discovery Feed Refresh
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          details="$(gh api 'repos/setoxxx/nycif-live-feeds/actions/workflows/discovery-feed-refresh.yml/runs?per_page=3' --jq '[.workflow_runs[] | {id, status, conclusion, event, head_sha, created_at, updated_at, html_url}]')"
          printf '%s' "$details" > /tmp/details.json
          cat /tmp/details.json

      - name: Report probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          details="$(cat /tmp/details.json 2>/dev/null || echo '[]')"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Latest live-feeds Discovery Feed Refresh runs:\n\n\`\`\`json\n${details}\n\`\`\`"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Remove probe workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/probe-live-feeds-refresh.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
              -f message='Remove completed live-feeds refresh probe' \
              -f sha="$sha" \
              -f branch='main'
          fi
