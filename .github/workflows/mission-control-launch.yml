name: Mission Control Launch QA

on:
  pull_request:
    paths:
      - 'admin/mission-control.html'
      - 'admin/mission-control-launch-v01.js'
      - 'admin/mission-control-summary-adapter-v01.js'
      - 'admin/data/mission-control-launch-state-v01.json'
      - 'docs/mission-control/MISSION_CONTROL_SUMMARY_CONTRACT.json'
      - 'docs/launch/FIELD_DESK_SERVICE_WORKER_PRE_RETIREMENT_QA.md'
      - 'tools/admin/mission-control-launch.test.mjs'
      - 'tools/admin/mission-control-summary-adapter.test.mjs'
      - 'tools/admin/service-worker-retirement-static.test.mjs'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/mission-control-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-control-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshot JSON
        run: node -e "JSON.parse(require('fs').readFileSync('admin/data/mission-control-launch-state-v01.json','utf8'))"
      - name: Validate reader-safe contract JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/mission-control/MISSION_CONTROL_SUMMARY_CONTRACT.json','utf8'))"
      - name: Syntax check
        run: |
          node --check admin/mission-control-launch-v01.js
          node --check admin/mission-control-summary-adapter-v01.js
      - name: Run launch safety and contract tests
        run: node tools/admin/mission-control-launch.test.mjs
      - name: Run summary prehost adapter tests
        run: node tools/admin/mission-control-summary-adapter.test.mjs
      - name: Run service-worker retirement static QA
        run: node tools/admin/service-worker-retirement-static.test.mjs
