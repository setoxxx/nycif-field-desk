name: ADR-0013 Approximate Rendering

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adr0013-rendering.yml'
      - 'app-schema-v1-major-all-v01.js'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adr-0013-approximate-markers
          fetch-depth: 0
      - name: Correct list anchor and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app-schema-v1-major-all-v01.js')
          text=path.read_text(encoding='utf-8')
          old="props.list_view_href || '#event-list'"
          new="props.list_view_href || '#eventList'"
          if old not in text:
              raise SystemExit('expected list anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check app-schema-v1-major-all-v01.js
          node tests/test-adr0013-approximate-markers.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-schema-v1-major-all-v01.js
          git commit -m "fix(adr-0013): link approximate popups to event list"
          git push origin HEAD:feat/adr-0013-approximate-markers
