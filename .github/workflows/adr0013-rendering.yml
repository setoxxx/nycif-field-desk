name: ADR-0013 Approximate Rendering

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: JavaScript syntax
        run: node --check app-schema-v1-major-all-v01.js
      - name: Verify ADR-0013 rendering contract
        run: node tests/test-adr0013-approximate-markers.mjs
      - name: Verify exact pins remain above approximate panes
        run: |
          node - <<'JS'
          const fs=require('fs');
          const app=fs.readFileSync('app-schema-v1-major-all-v01.js','utf8');
          if (!app.includes("['approximateMunicipalityPane', 420]")) throw new Error('municipality pane');
          if (!app.includes("['approximateParkPane', 430]")) throw new Error('park pane');
          if (!app.includes("['approximateFacilityPane', 440]")) throw new Error('facility pane');
          if (!app.includes('markerPane (z-index 600)')) throw new Error('exact z-order contract');
          if (!app.includes("props.list_view_href || '#eventList'")) throw new Error('event list target');
          JS
