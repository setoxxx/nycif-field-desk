name: Public Map Retirement Refresh QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'scripts/build_retired_pages.py'
      - 'tests/public-map-retirement-contract.mjs'
      - 'tests/retirement-service-worker.test.mjs'
      - 'docs/rung14-field-desk-retirement-rollback.md'
      - '.github/workflows/public-map-retirement-refresh-qa.yml'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify retired public root contract
        run: node tests/public-map-retirement-contract.mjs
      - name: Verify stale-cache cleanup and navigation redirect behavior
        run: node --test tests/retirement-service-worker.test.mjs
      - name: Verify rollback source semantics are pinned
        run: |
          set -euo pipefail
          doc='docs/rung14-field-desk-retirement-rollback.md'
          grep -Fq 'c86db5e0a9334539d4fb2233bebdbf75dff6df65' "$doc"
          grep -Fq 'Historical candidate creation anchor' "$doc"
          grep -Fq 'Current certified protected-base snapshot' "$doc"
          grep -Fq 'effective rollback source' "$doc"
          grep -Fq 'immediately before any separately authorized merge' "$doc"
          grep -Fq 'without force-rewriting history' "$doc"
          grep -Fq 'does not authorize merge, deployment, rollback' "$doc"
          echo FIELD_DESK_ROLLBACK_SOURCE_SEMANTICS_PASS
      - name: Build retirement-only Pages artifact
        run: python3 scripts/build_retired_pages.py
      - name: Fail closed on legacy public routes in artifact
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/field-desk-pages"
          test -s "$root/index.html"
          test -s "$root/service-worker.js"
          test -f "$root/.nojekyll"
          test ! -e "$root/admin"
          test ! -e "$root/approved-export-preview.html"
          test ! -e "$root/desk.html"
          test ! -e "$root/live-alerts.html"
          test ! -e "$root/live-qa-standalone.html"
          test ! -e "$root/mobile.html"
          test ! -e "$root/nightlife-preview.html"
          test ! -e "$root/preview-major-feed-review.html"
          test ! -e "$root/prototype-major-events-review.html"
          test ! -e "$root/public.html"
          test ! -e "$root/special-overlays-test.html"
          test ! -e "$root/web.html"
          count="$(find "$root" -type f | wc -l | tr -d ' ')"
          test "$count" = '3'
          echo FIELD_DESK_RETIREMENT_ARTIFACT_ZERO_LEGACY_ROUTES_PASS
      - name: Verify Pages publication is main-only
        run: |
          set -euo pipefail
          workflow='.github/workflows/static.yml'
          python3 - "$workflow" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text()
          if 'branches: ["main"]' not in text:
              raise SystemExit('Field Desk Pages push allowlist is not main-only')
          guard = "if: $" + "{{ github.ref == 'refs/heads/main' }}"
          if guard not in text:
              raise SystemExit('Field Desk deploy job lacks main-only workflow_dispatch fail-closed guard')
          print('FIELD_DESK_PAGES_MAIN_ONLY_PUBLICATION_BOUNDARY_PASS')
          PY
