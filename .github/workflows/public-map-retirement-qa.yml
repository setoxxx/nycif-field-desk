name: Public Map Retirement QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'tests/public-map-retirement-contract.mjs'
      - '.github/workflows/public-map-retirement-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical redirect and legacy runtime removal
        run: node tests/public-map-retirement-contract.mjs
