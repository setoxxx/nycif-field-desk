name: Desktop Release Gates

on:
  pull_request:
    paths:
      - "index.html"
      - "accessibility-v01.js"
      - "accessibility-v01.css"
      - "app-schema-v1-major-all-v01.js"
      - "event-feed-schema-v1.js"
      - "nyc-calendar-runtime-v01.js"
      - "public-feed-policy-v01.js"
      - "public-release-guard-v01.js"
      - "tip-jar-motion-policy-v01.js"
      - "tip-jar-motion-safety-v01.css"
      - "nycif-tip-jar-v01.js"
      - "service-worker.js"
      - "tests/desktop-release-gates.mjs"
      - "tests/public-release-blockers.test.mjs"
      - "tests/public-map-retirement-contract.mjs"
      - "tests/test_protected_staging_accessibility_contract.py"
      - ".github/workflows/desktop-release-gates.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "accessibility-v01.js"
      - "accessibility-v01.css"
      - "app-schema-v1-major-all-v01.js"
      - "event-feed-schema-v1.js"
      - "nyc-calendar-runtime-v01.js"
      - "public-feed-policy-v01.js"
      - "public-release-guard-v01.js"
      - "tip-jar-motion-policy-v01.js"
      - "tip-jar-motion-safety-v01.css"
      - "nycif-tip-jar-v01.js"
      - "service-worker.js"
      - "tests/desktop-release-gates.mjs"
      - "tests/public-release-blockers.test.mjs"
      - "tests/public-map-retirement-contract.mjs"
      - "tests/test_protected_staging_accessibility_contract.py"
      - ".github/workflows/desktop-release-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect public runtime state
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'https://nycinfocus.com/map/' index.html && ! grep -Eqi 'leaflet|raw\.githubusercontent\.com' index.html; then
            echo 'state=retired' >> "$GITHUB_OUTPUT"
          else
            echo 'state=active' >> "$GITHUB_OUTPUT"
          fi

      - name: Run active public release blocker contracts
        if: steps.runtime.outputs.state == 'active'
        run: node tests/public-release-blockers.test.mjs

      - name: Run retired public runtime contract
        if: steps.runtime.outputs.state == 'retired'
        run: node tests/public-map-retirement-contract.mjs

      - name: Install browser QA dependencies
        if: steps.runtime.outputs.state == 'active'
        run: |
          npm install --no-save playwright@1.54.1 @axe-core/playwright@4.10.2
          npx playwright install chromium

      - name: Start exact reviewed runtime
        if: steps.runtime.outputs.state == 'active'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nycif-desktop-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nycif-desktop-server.log
          exit 1

      - name: Run desktop keyboard accessibility and performance gates
        if: steps.runtime.outputs.state == 'active'
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          node tests/desktop-release-gates.mjs 2>&1 | tee artifacts/desktop-release-gates.log
          status=${PIPESTATUS[0]}
          cp /tmp/nycif-desktop-server.log artifacts/server.log || true
          exit "$status"

      - name: Record retired desktop semantics
        if: steps.runtime.outputs.state == 'retired'
        run: |
          mkdir -p artifacts
          printf '%s\n' 'RETIRED_RUNTIME: redirect-only root; active Leaflet/application-shell browser gates are not applicable. Retirement contract passed.' > artifacts/desktop-release-gates.log

      - name: Upload desktop QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-gates
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
