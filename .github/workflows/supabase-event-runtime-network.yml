name: Supabase Event Runtime Network Gate

on:
  pull_request:
    paths:
      - "index.html"
      - "supabase-event-runtime-v01.js"
      - "service-worker.js"
      - "tests/supabase-event-runtime-network.mjs"
      - ".github/workflows/supabase-event-runtime-network.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-event-runtime-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install chromium

      - name: Start reviewed runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nycif-supabase-runtime-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nycif-supabase-runtime-server.log
          exit 1

      - name: Prove Supabase-only event-data network
        run: node tests/supabase-event-runtime-network.mjs
