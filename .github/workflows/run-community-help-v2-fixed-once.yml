name: Run Community Help v2 Fixed Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    if: github.event.issue.title == 'RUN COMMUNITY HELP V2 FIXED'
    runs-on: ubuntu-latest
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: feature/community-help-stages-1-5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and validate public resource data
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/sync_community_help_v2_fixed.py | tee /tmp/generation.txt
          python scripts/validate_community_help.py | tee /tmp/validation.txt
          node --check community-help-v01.js
          node tests/public-release-blockers.test.mjs | tee /tmp/release.txt
      - name: Commit generated evidence to execution branch
        id: commit
        if: steps.generate.outcome == 'success'
        run: |
          if git diff --quiet -- data/community-help; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/community-help
          git commit -m 'Refresh corrected Community Help v2 public data [skip ci]'
          git push origin HEAD:feature/community-help-stages-1-5
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Report execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          COMMIT_CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          generation="$(cat /tmp/generation.txt 2>/dev/null || true)"
          validation="$(cat /tmp/validation.txt 2>/dev/null || true)"
          release="$(cat /tmp/release.txt 2>/dev/null || true)"
          body=$(cat <<EOF
          Community Help v2 corrected execution result:

          - generation: ${GENERATE_OUTCOME}
          - commit: ${COMMIT_OUTCOME}
          - generated files changed: ${COMMIT_CHANGED:-unknown}

          Generation summary:
          \`\`\`
          ${generation}
          \`\`\`

          Validation summary:
          \`\`\`
          ${validation}
          \`\`\`

          Release contracts:
          \`\`\`
          ${release}
          \`\`\`
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
          if [ "$GENERATE_OUTCOME" = 'success' ] && [ "$COMMIT_OUTCOME" = 'success' ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
          fi
      - name: Remove one-time runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/run-community-help-v2-fixed-once.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
              -f message='Remove completed Community Help v2 fixed runner' \
              -f sha="$sha" \
              -f branch='main'
          fi
      - name: Enforce success
        if: steps.generate.outcome != 'success' || steps.commit.outcome != 'success'
        run: exit 1
