name: Commit Community Help v2 Generated Files Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate-and-commit:
    if: github.event.issue.title == 'COMMIT COMMUNITY HELP V2 GENERATED FILES'
    runs-on: ubuntu-latest
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: feature/community-help-stages-1-5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate public resource data
        run: python scripts/sync_community_help_v2_fixed.py | tee /tmp/generation.txt
      - name: Validate Community Help
        run: python scripts/validate_community_help.py | tee /tmp/validation.txt
      - name: Validate runtime and release contracts
        run: |
          node --check community-help-v01.js
          node tests/public-release-blockers.test.mjs | tee /tmp/release.txt
      - name: Stage tracked and newly generated files
        id: commit
        run: |
          git add \
            data/community-help/homebase.json \
            data/community-help/senior.json \
            data/community-help/family.json \
            data/community-help/digital.json \
            data/community-help/restroom.json \
            data/community-help/sync-summary-v2.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit validated Community Help v2 generated files [skip ci]'
          git push origin HEAD:feature/community-help-stages-1-5
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verify files exist in committed HEAD
        run: |
          for file in \
            data/community-help/homebase.json \
            data/community-help/senior.json \
            data/community-help/family.json \
            data/community-help/digital.json \
            data/community-help/restroom.json \
            data/community-help/sync-summary-v2.json; do
            git cat-file -e "HEAD:${file}"
          done
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          generation="$(cat /tmp/generation.txt)"
          validation="$(cat /tmp/validation.txt)"
          release="$(cat /tmp/release.txt)"
          body=$(cat <<EOF
          Community Help v2 generated-file commit gate passed.

          - committed new generated files: ${CHANGED:-false}

          Generation summary:
          \`\`\`
          ${generation}
          \`\`\`

          Validation summary:
          \`\`\`
          ${validation}
          \`\`\`

          Release contracts:
          \`\`\`
          ${release}
          \`\`\`
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
      - name: Remove one-time runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/commit-community-help-v2-generated-once.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
              -f message='Remove completed Community Help v2 generated-file runner' \
              -f sha="$sha" \
              -f branch='main'
          fi
